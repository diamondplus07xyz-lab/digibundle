<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Bag Gradient: Vibrant Coral/Pink to Deep Electric Indigo/Violet -->
    <linearGradient id="cr-bag-grad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FF3A70" />
      <stop offset="28%" stop-color="#E11D74" />
      <stop offset="65%" stop-color="#7C22CE" />
      <stop offset="100%" stop-color="#43147D" />
    </linearGradient>

    <!-- Bag Left Shoulder Highlight -->
    <linearGradient id="cr-bag-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FF3A70" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#7C22CE" stop-opacity="0" />
    </linearGradient>

    <!-- Front Orbit Ring Gradient -->
    <linearGradient id="cr-orbit-front" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="30%" stop-color="#9333EA" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FF2E93" />
    </linearGradient>

    <!-- Back Orbit Ring Gradient (Darker for depth) -->
    <linearGradient id="cr-orbit-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Soft Ambient Glow / Shadows -->
    <filter id="cr-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4C1D95" flood-opacity="0.45" />
    </filter>
    <filter id="cr-clapper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E0B36" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- BACKGROUND ORBIT RING (Behind bag) -->
  <path d="M 92 342 C 58 318 48 274 72 232 C 86 208 114 186 156 168" 
        fill="none" 
        stroke="url(#cr-orbit-back)" 
        stroke-width="18" 
        stroke-linecap="round" />

  <!-- BAG HANDLES (Behind bag) -->
  <g stroke="#0F172A" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back Handle -->
    <path d="M 230 156 C 224 88 288 74 316 116 C 330 138 338 168 340 184" opacity="0.6" />
    <!-- Front Handle -->
    <path d="M 204 168 C 196 78 280 62 312 118 C 326 142 334 176 336 196" />
  </g>
  <!-- Handle highlight -->
  <path d="M 220 120 C 242 80 286 78 306 108" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- MAIN BAG BODY -->
  <g filter="url(#cr-shadow)">
    <!-- Base 3D Curved Bag Body -->
    <path d="M 188 172 
             C 192 160 202 152 216 152 
             L 344 164 
             C 356 165 366 174 368 186 
             L 396 352 
             C 399 374 382 396 360 398 
             L 172 408 
             C 148 409 130 390 133 366 
             Z" 
          fill="url(#cr-bag-grad)" />

    <!-- 3D Soft Left Volume / Highlight -->
    <path d="M 188 172 
             C 192 160 202 152 216 152 
             L 260 156 
             L 190 407 
             L 172 408 
             C 148 409 130 390 133 366 
             Z" 
          fill="url(#cr-bag-highlight)" />

    <!-- Handle Grommets / Rivets -->
    <circle cx="216" cy="180" r="7" fill="#0B0F19" />
    <circle cx="216" cy="180" r="4" fill="#334155" />
    <circle cx="340" cy="190" r="7" fill="#0B0F19" />
    <circle cx="340" cy="190" r="4" fill="#334155" />
  </g>

  <!-- CLAPPERBOARD ON BAG -->
  <g transform="translate(258, 282) rotate(-8)" filter="url(#cr-clapper-shadow)">
    <!-- White Rounded Board Body -->
    <rect x="-84" y="-62" width="168" height="136" rx="28" fill="#FFFFFF" />

    <!-- Clapper Slanted Top Stripes -->
    <g clip-path="url(#cr-clapper-clip)">
      <clipPath id="cr-clapper-clip">
        <rect x="-84" y="-62" width="168" height="42" rx="20" />
      </clipPath>
      <rect x="-84" y="-62" width="168" height="42" fill="#2E0854" />
      <!-- Slanted White Stripes -->
      <path d="M -70 -20 L -48 -66 L -32 -66 L -54 -20 Z" fill="#FFFFFF" />
      <path d="M -24 -20 L -2 -66 L 14 -66 L -8 -20 Z" fill="#FFFFFF" />
      <path d="M 22 -20 L 44 -66 L 60 -66 L 38 -20 Z" fill="#FFFFFF" />
    </g>

    <!-- Clapper Lower Screen / Video Canvas -->
    <rect x="-70" y="-12" width="140" height="74" rx="14" fill="#4C0F8A" />

    <!-- Central Play Triangle -->
    <path d="M -12 8 L 18 25 L -12 42 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND ORBITING SWOOSH RING (Wraps in front of bag) -->
  <g filter="url(#cr-shadow)">
    <!-- Dynamic curved ring sweeping across the lower front from left to right -->
    <path d="M 72 346 
             C 60 380 92 414 150 426 
             C 232 444 336 414 416 348 
             C 436 332 444 316 438 306 
             C 432 296 414 300 392 312 
             C 324 350 234 382 158 370 
             C 120 364 96 348 88 334 
             Z" 
          fill="url(#cr-orbit-front)" />
    <!-- Inner bright specular rim highlight on ring -->
    <path d="M 96 354 C 132 384 212 400 292 384 C 348 372 396 344 424 322" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.4" />
  </g>
</svg>
